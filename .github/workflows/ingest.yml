name: ingest

# Scheduled, repeatable ingestion (Part 1).
# 07:17 UTC on weekdays = 18:17 Sydney in daylight time, 17:17 in standard time:
# after the ASX close and closing auction. Minute 17 avoids GitHub's top-of-hour load.
on:
  schedule:
    - cron: "17 7 * * 1-5"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Failure scenario to demonstrate (simulations never change clean tables)"
        type: choice
        options: ["none", "429", "late", "schema"]
        default: "none"

permissions:
  contents: write   # commit new raw snapshots and logs
  issues: write     # open an issue for the data owner when a load stops

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m pipeline.run --simulate "${{ inputs.simulate || 'none' }}"

      - name: Show run summary
        if: always()
        run: cat data/quality/last_run_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data and quality logs
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ingest run ${{ github.run_id }} (simulate=${{ inputs.simulate || 'none' }})"
          git pull --rebase --quiet && git push

      - name: Alert the data owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Pipeline alert: $(date -u +%F)" --body-file data/quality/last_run_summary.md
